<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Klinische Scores</title>
  <meta name="description" content="qSOFA, CURB-65, HEART, Wells und NIHSS schnell berechnen – mit Interpretation und Originalquelle.">
  <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111418" media="(prefers-color-scheme: dark)">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <div class="brand">Klinische Scores</div>
    <nav id="nav" class="tabs" aria-label="Score auswählen"></nav>
  </header>

  <main>
    <div class="head">
      <div>
        <h1 id="title"></h1>
        <p id="subtitle" class="subtitle"></p>
      </div>
      <button id="reset" type="button" class="reset">Zurücksetzen</button>
    </div>

    <div id="form" class="form"></div>

    <section id="detail" class="detail" aria-live="polite"></section>

    <p class="disclaimer">
      Entscheidungshilfe für medizinisches Fachpersonal. Kein Medizinprodukt; ersetzt nicht die klinische Beurteilung.
      Es werden keine Eingaben gespeichert oder übertragen.
    </p>
  </main>

  <div id="bar" class="bar" role="status"></div>

  <script src="js/scores.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
