name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax prüfen
        run: for f in js/*.js sw.js tests/*.js; do node --check "$f" || exit 1; done && node -e "JSON.parse(require('fs').readFileSync('manifest.json','utf8'))"
      - name: Tests
        run: node tests/scores.test.js
      - name: Browsertest
        run: node tests/ui.test.js

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Seite zusammenstellen
        run: mkdir _site && cp -r index.html pruefung.html manifest.json sw.js css js icons _site/
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
